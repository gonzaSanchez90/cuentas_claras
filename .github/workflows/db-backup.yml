name: Backup Base de Datos

on:
  schedule:
    # Todos los domingos a las 3am UTC (medianoche Argentina)
    - cron: '0 3 * * 0'
  workflow_dispatch:
    # También se puede correr manualmente desde GitHub Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Exportar BD a JSON
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node server/backup-export.mjs

      - name: Commit y push del backup
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add backups/
          if git diff --staged --quiet; then
            echo "Sin cambios en la BD, no se crea commit."
          else
            git commit -m "backup: $(date +%Y-%m-%d)"
            git push
          fi
