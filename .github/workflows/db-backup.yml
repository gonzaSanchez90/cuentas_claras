name: Backup Base de Datos

on:
  schedule:
    # Todos los domingos a las 3am UTC (medianoche Argentina)
    - cron: '0 3 * * 0'
  workflow_dispatch:
    # También se puede correr manualmente desde GitHub Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar cliente Turso
        run: npm install @libsql/client

      - name: Exportar BD a JSON
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          node --input-type=module <<'EOF'
          import { createClient } from '@libsql/client';
          import fs from 'fs';

          const client = createClient({
            url: process.env.TURSO_DATABASE_URL,
            authToken: process.env.TURSO_AUTH_TOKEN,
          });

          const backup = {};
          for (const table of ['users', 'months', 'participants', 'expenses']) {
            const res = await client.execute(`SELECT * FROM ${table}`);
            backup[table] = res.rows.map(r => ({ ...r }));
            console.log(`  ${table}: ${backup[table].length} registros`);
          }

          const date = new Date().toISOString().split('T')[0];
          fs.mkdirSync('backups', { recursive: true });
          fs.writeFileSync(`backups/${date}.json`, JSON.stringify(backup, null, 2));
          console.log(`✅ Backup guardado: backups/${date}.json`);
          process.exit(0);
          EOF

      - name: Commit y push del backup
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add backups/
          if git diff --staged --quiet; then
            echo "Sin cambios en la BD, no se crea commit."
          else
            git commit -m "backup: $(date +%Y-%m-%d)"
            git push
          fi
